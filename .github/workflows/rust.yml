name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCKER_TEST_IMAGE: bdu-parser-test
      DOCKER_TEST_DB_URL: postgresql://bdu:bdu@host.docker.internal:5438/bdu

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build test image
        run: docker build -f Dockerfile.test -t "$DOCKER_TEST_IMAGE" .
      - name: Start containers
        run: docker compose -f docker-compose.yml up -d --wait
      - name: Run tests
        run: >-
          docker run --rm
          --add-host=host.docker.internal:host-gateway
          -e BDU_TEST_DATABASE_URL="$DOCKER_TEST_DB_URL"
          -v "$GITHUB_WORKSPACE:/workspace"
          -w /workspace
          "$DOCKER_TEST_IMAGE"
          /bin/sh -lc 'cargo test --package bdu_parser --lib -- --nocapture'
      - name: Stop containers
        if: always()
        run: docker compose -f docker-compose.yml down -v
