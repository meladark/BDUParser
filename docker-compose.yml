version: "3.9"

services:
  postgresql:
    image: postgres:17
    container_name: bdu_postgres
    restart: always
    shm_size: 1g
    environment:
      - POSTGRES_DB=bdu
      - POSTGRES_USER=bdu
      - POSTGRES_PASSWORD=bdu
      - POSTGRES_ROOT_PASSWORD=bdu
    expose:
      - "5438"
    ports:
      - "5438:5433"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    command: -p 5433
